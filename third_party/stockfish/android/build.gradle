group 'com.stockfish'
version '1.0'

buildscript {
    repositories {
        google()
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        jcenter()
    }
}

apply plugin: 'com.android.library'

def chessnutTargetAbis = {
    def targetPlatform = (project.findProperty('target-platform')
            ?: rootProject.findProperty('target-platform')
            ?: '').toString()
    def abis = []
    targetPlatform.split(',').collect { it.trim() }.each { platform ->
        if (platform == 'android-arm') {
            abis << 'armeabi-v7a'
        } else if (platform == 'android-arm64') {
            abis << 'arm64-v8a'
        } else if (platform == 'android-x64') {
            abis << 'x86_64'
        }
    }
    return abis.unique() ?: ['arm64-v8a']
}

android {
    // add support for both AGP v8 and older versions
    // https://github.com/flutter/flutter/issues/125621#issuecomment-1525995461
    if (project.android.hasProperty("namespace")) {
        namespace 'com.arjanaswal.stockfish'
    }

    compileSdkVersion 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        minSdkVersion 21
        ndk {
            abiFilters(*chessnutTargetAbis())
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}
