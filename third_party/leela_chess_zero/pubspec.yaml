name: leela_chess_zero
description: The Leela Chess Zero (lc0) neural network chess engine for Flutter.
version: 1.0.0
repository: https://github.com/ArjanAswal/LeelaChessZero.git
homepage: https://github.com/ArjanAswal/LeelaChessZero

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  ffi: ^2.0.0
  flutter:
    sdk: flutter
  logging: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.leelachesszero
        pluginClass: Lc0Plugin
      ios:
        pluginClass: Lc0Plugin
